name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve the recovery job's bounded owned-process cleanup window.
  cancel-in-progress: false
jobs:
  validate:
    name: Swift and iOS build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          set -euo pipefail
          mkdir -p build/ci-toolchain
          xcodebuild -version | tee build/ci-toolchain/xcode.txt
          swift --version | tee build/ci-toolchain/swift.txt
          brew install xcodegen
      - name: Verify
        run: |
          set -euo pipefail
          TRIPDOCKET_VERIFY_COMMIT=$(git rev-parse HEAD)
          bash scripts/verify.sh
          test "$TRIPDOCKET_VERIFY_COMMIT" = "$(git rev-parse HEAD)"
          printf '%s\n' "$TRIPDOCKET_VERIFY_COMMIT" > build/ci-toolchain/verified-commit.txt
      - name: Package verified Simulator preview
        run: bash scripts/package-ci-preview.sh
      - name: Simulator integration and StoreKit tests
        run: bash scripts/test-simulator.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TripDocket-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/*.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Simulator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TripDocket-simulator-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-preview/TripDocket-Simulator.zip
            build/ci-preview/provenance.json
            build/ci-preview/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  privacy_ipad:
    name: iPad privacy and support
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        timeout-minutes: 3
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Owned iPad guidance (EN normal, RU maximum type)
        timeout-minutes: 29
        run: bash scripts/test-privacy-support-ipad.sh
      - name: iPad test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TripDocket-privacy-ipad-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/PrivacySupport-iPad/
          if-no-files-found: warn
          retention-days: 7
  recovery:
    name: Free backup and recovery
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TRIPDOCKET_RUNNER_LABEL: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Hosted adapter regression checks
        timeout-minutes: 2
        run: python3 -B scripts/test-recovery-hosted.py
      - name: One bounded recovery attempt
        timeout-minutes: 27
        env:
          TRIPDOCKET_RUNNER_ARCH: ${{ runner.arch }}
          TRIPDOCKET_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/recovery_hosted.py --run
      - name: Recovery evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TripDocket-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/PhaseLogs/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/Capability/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/BeforeReset/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/AfterRestore/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*-attachments/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
  gate:
    name: CI gate
    if: always()
    needs: [validate, privacy_ipad, recovery]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          PHONE_RESULT: ${{ needs.validate.result }}
          IPAD_RESULT: ${{ needs.privacy_ipad.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          test "$PHONE_RESULT" = success
          test "$IPAD_RESULT" = success
          test "$RECOVERY_RESULT" = success
