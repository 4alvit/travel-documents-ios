name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  # Preserve the recovery job's bounded owned-process cleanup window.
  cancel-in-progress: false
jobs:
  validate:
    name: Swift, hosted tests and purchase UI
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      # Keep the Release producer and core tests on matched Xcode 26.2.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p build/ci-toolchain
          xcodebuild -version | tee build/ci-toolchain/xcode.txt
          test "$(cat build/ci-toolchain/xcode.txt)" = $'Xcode 26.2\nBuild version 17C52'
          swift --version | tee build/ci-toolchain/swift.txt
          brew install xcodegen
          # Recognize exact producer documentation; runtime acceptance is separate.
          TRIPDOCKET_QUALIFY_DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
          DEVELOPER_DIR="$TRIPDOCKET_QUALIFY_DEVELOPER_DIR" xcodebuild -version > build/ci-toolchain/qualification-xcode.txt
          test "$(cat build/ci-toolchain/qualification-xcode.txt)" = "$(printf 'Xcode 26.2\nBuild version 17C52')"
          DEVELOPER_DIR="$TRIPDOCKET_QUALIFY_DEVELOPER_DIR" xcrun xcresulttool get test-results summary --schema > build/ci-toolchain/qualification-summary-schema.json
          DEVELOPER_DIR="$TRIPDOCKET_QUALIFY_DEVELOPER_DIR" xcrun xcresulttool get test-results tests --schema > build/ci-toolchain/qualification-tests-schema.json
          python3 -B scripts/qualify-release.py --validate-schemas build/ci-toolchain/qualification-summary-schema.json build/ci-toolchain/qualification-tests-schema.json
      - name: Qualification toolchain evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-qualification-toolchain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-toolchain/qualification-*
          if-no-files-found: warn
          retention-days: 7
      - name: Simulator selector regression checks
        timeout-minutes: 2
        run: |
          python3 -B scripts/test-select-simulator.py
          python3 -B scripts/test-prepare-guidance-files.py
      - name: Verify
        run: |
          set -euo pipefail
          TRIPDOCKET_VERIFY_COMMIT=$(git rev-parse HEAD)
          bash scripts/verify.sh
          test "$TRIPDOCKET_VERIFY_COMMIT" = "$(git rev-parse HEAD)"
          printf '%s\n' "$TRIPDOCKET_VERIFY_COMMIT" > build/ci-toolchain/verified-commit.txt
      - name: Package verified Simulator preview
        run: bash scripts/package-ci-preview.sh
      - name: Simulator integration and StoreKit tests
        id: integration
        run: bash scripts/test-simulator.sh --require-sdk-match --cohort core-purchase
      - name: Extract existing Files/payment failure pairs
        if: ${{ failure() && steps.integration.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -B scripts/files_picker_failure.py --run
      - name: Files/payment failure evidence
        if: ${{ always() && steps.integration.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-files-picker-failure-core-purchase-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/failure.png
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/failure-ax.txt
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/evidence.json
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/payment-failure.png
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/payment-failure-ax.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-tests-core-purchase-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*.xcresult
            build/ci-toolchain/simulator-selection.*/
          if-no-files-found: warn
          retention-days: 7
      - name: Simulator artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-simulator-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-preview/TripDocket-Simulator.zip
            build/ci-preview/provenance.json
            build/ci-preview/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  ui_guidance:
    name: Accessibility, localization and guidance UI
    # Limit this workflow to two eligible macOS jobs during hosted capacity shortages.
    # All macOS jobs use Intel after repeated ARM runner assignment timeouts.
    needs: validate
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    # Run 41440392190 completed all phone cases in 37m56s but exceeded the old 35m job cap.
    # Cold startup in run 41577208390 consumed about 711s before its preparation case.
    # 65m = checkout2 + toolchain3 + integration45 + cancellation5
    #       + raw evidence3 + optional extraction3/upload2 + finalization2.
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Toolchain
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p build/ci-toolchain
          xcodebuild -version | tee build/ci-toolchain/xcode.txt
          test "$(cat build/ci-toolchain/xcode.txt)" = $'Xcode 26.2\nBuild version 17C52'
          swift --version | tee build/ci-toolchain/swift.txt
          brew install xcodegen
      - name: Simulator integration and StoreKit tests
        id: integration
        timeout-minutes: 45
        # Provider initialization is explicit; this is not cold Files first-use coverage.
        run: bash scripts/test-simulator.sh --require-sdk-match --prepare-files --cohort ui-guidance
      # Preserve raw results before optional failure extraction consumes its budget.
      - name: Test evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-tests-ui-guidance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*.xcresult
            build/ci-toolchain/simulator-selection.*/
          if-no-files-found: warn
          retention-days: 7
      - name: Extract existing Files/payment failure pairs
        if: ${{ failure() && steps.integration.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -B scripts/files_picker_failure.py --run
      - name: Files/payment failure evidence
        if: ${{ always() && steps.integration.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-files-picker-failure-ui-guidance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/failure.png
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/failure-ax.txt
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/evidence.json
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/payment-failure.png
            build/FilesPickerFailure-${{ github.run_id }}-${{ github.run_attempt }}/public/payment-failure-ax.txt
          if-no-files-found: warn
          retention-days: 7
  privacy_ipad:
    name: iPad privacy and support (${{ matrix.locale }})
    # Keep iPad diagnostics eligible after ordinary Recovery failures.
    needs: recovery
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - locale: en-US
            step_minutes: 55
            job_minutes: 62
          - locale: ru-RU
            step_minutes: 55
            job_minutes: 62
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: ${{ matrix.job_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Toolchain
        timeout-minutes: 3
        run: |
          TRIPDOCKET_IPAD_XCODE_VERSION=$(xcodebuild -version)
          printf '%s\n' "$TRIPDOCKET_IPAD_XCODE_VERSION"
          test "$TRIPDOCKET_IPAD_XCODE_VERSION" = $'Xcode 26.2\nBuild version 17C52'
          swift --version
          brew install xcodegen
      - name: Owned iPad guidance (${{ matrix.locale }})
        # 50m Intel work + 3m cleanup + 2m startup/finalization headroom.
        timeout-minutes: ${{ matrix.step_minutes }}
        run: bash scripts/test-privacy-support-ipad.sh --locale '${{ matrix.locale }}'
      - name: iPad test evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-privacy-ipad-${{ matrix.locale }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/PrivacySupport-iPad/${{ matrix.locale }}/
          if-no-files-found: warn
          retention-days: 7
  recovery:
    name: Free backup and recovery
    # 40m = checkout 2 + offline regressions 6 + native recovery 27 + evidence 5.
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      TRIPDOCKET_RUNNER_LABEL: macos-15-intel
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Hosted adapter regression checks
        timeout-minutes: 6
        run: |
          python3 -B scripts/test-recovery-hosted.py
          python3 -B scripts/test-files-picker-failure.py
          python3 -B scripts/test-files-readiness.py
          python3 -B scripts/test-privacy-support-ipad-unit.py
          python3 -B scripts/test-privacy-reading-geometry.py
          python3 -B scripts/test-verify-recovery-evidence.py
          python3 -B scripts/test-prepare-release.py
          python3 -B scripts/test-qualify-release.py
          python3 -B scripts/test-batch-driver.py
          python3 -B scripts/test-batch-checkpoint.py
          python3 -B scripts/test-batch-checkpoint-host.py
          python3 -B scripts/test-batch-import-diagnostics.py
          python3 -B scripts/test-simulator-driver-inventory.py
      - name: One bounded recovery attempt
        timeout-minutes: 27
        env:
          TRIPDOCKET_RUNNER_ARCH: ${{ runner.arch }}
          TRIPDOCKET_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/recovery_hosted.py --run
      - name: Recovery evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/PhaseLogs/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/Capability/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/BeforeReset/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/AfterRestore/
            build/RecoveryHosted-${{ github.run_id }}-${{ github.run_attempt }}/*-attachments/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
  gate:
    name: CI gate
    if: always()
    needs: [validate, ui_guidance, privacy_ipad, recovery]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          CORE_PURCHASE_RESULT: ${{ needs.validate.result }}
          UI_GUIDANCE_RESULT: ${{ needs.ui_guidance.result }}
          # Aggregate matrix result requires both fixed locales to succeed.
          IPAD_RESULT: ${{ needs.privacy_ipad.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          test "$CORE_PURCHASE_RESULT" = success
          test "$UI_GUIDANCE_RESULT" = success
          test "$IPAD_RESULT" = success
          test "$RECOVERY_RESULT" = success
