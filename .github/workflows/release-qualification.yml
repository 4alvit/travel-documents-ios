name: StoreKit toolchain schema probe
run-name: Read-only Xcode 16.4 result-schema capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Record exact toolchain and schema documents
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p schema-probe
          xcodebuild -version > schema-probe/xcode.txt
          test "$(cat schema-probe/xcode.txt)" = $'Xcode 16.4\nBuild version 16F6'
          xcrun --sdk iphonesimulator --show-sdk-version > schema-probe/sdk.txt
          xcrun xcresulttool version > schema-probe/xcresulttool-version.txt
          for kind in summary tests; do
            status=0
            xcrun xcresulttool get test-results "$kind" --schema > "schema-probe/$kind.json" 2> "schema-probe/$kind.stderr" || status=$?
            printf '%s\n' "$status" > "schema-probe/$kind.exit-code"
          done
          shasum -a 256 schema-probe/* > schema-probe/SHA256SUMS
      - name: Toolchain schema evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-schema-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-probe/
          if-no-files-found: error
          retention-days: 7
