name: Purchase anchor diagnostic
run-name: "Purchase anchor pair (${{ inputs.runner }}): child then swiftUI"
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Explicit diagnostic host profile
        type: choice
        required: true
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
concurrency:
  group: purchase-anchor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      PURCHASE_ANCHOR_RUNNER: ${{ inputs.runner }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        timeout-minutes: 3
        run: brew install xcodegen
      - name: Verify diagnostic guards
        timeout-minutes: 2
        run: python3 -B scripts/test-purchase-anchor-runner.py
      - name: Capture the declared same-build pair
        timeout-minutes: 34
        run: python3 -B scripts/diagnose-purchase-anchor.py --run
      - name: Preserve both outcomes and original evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-diagnostic-purchase-anchor-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/PurchaseAnchor-*/
            !build/PurchaseAnchor-*/DerivedData/
          if-no-files-found: error
          retention-days: 14
