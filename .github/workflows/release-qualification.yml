name: Release qualification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture one opt-in suite for independent release review
        type: choice
        required: true
        options: [batch, biometrics]
permissions:
  contents: read
concurrency:
  group: release-qualification-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 55
    # A successful capture still requires independent xcresult and visual review.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        timeout-minutes: 3
        run: brew install xcodegen
      - name: Verify qualification guards
        timeout-minutes: 2
        run: python3 -B scripts/test-qualify-release.py
      - name: Capture selected suite for review
        timeout-minutes: 44
        env:
          QUALIFICATION_MODE: ${{ inputs.mode }}
        run: python3 -B scripts/qualify-release.py --mode "$QUALIFICATION_MODE"
      - name: Qualification evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-qualification-${{ inputs.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ReleaseQualification-*/
            build/BatchSimulator-*/summary.json
            build/BatchSimulator-*/actions.jsonl
            build/BatchSimulator-*/fixtures/
            build/BatchSimulator-*/fixture-manifest.json
            build/BatchSimulator-*/xcresult-*.json
            build/BatchSimulator-*/xcodebuild.log
            build/BatchSimulator-*/Tests.xcresult/
            build/PrivacySimulator-*/summary.json
            build/PrivacySimulator-*/actions.jsonl
            build/PrivacySimulator-*/xcresult-*.json
            build/PrivacySimulator-*/xcodebuild.log
            build/PrivacySimulator-*/Tests.xcresult/
          if-no-files-found: error
          retention-days: 14
