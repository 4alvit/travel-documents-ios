name: Release qualification
run-name: "Release qualification: ${{ inputs.mode }} / ${{ inputs.runner || 'macos-15' }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture one opt-in suite for independent release review
        type: choice
        required: true
        options: [batch, biometrics, ordinary-smoke]
      runner:
        description: Hosted runner architecture (Intel is an explicit contingency)
        type: choice
        required: true
        default: macos-15
        options: [macos-15, macos-15-intel]
      commit:
        description: Ordinary-smoke only; exact reviewed successful-main source SHA
        type: string
        required: false
        default: ''
      ci_run_id:
        description: Ordinary-smoke only; complete successful main-push CI run ID
        type: string
        required: false
        default: ''
      artifact_id:
        description: Ordinary-smoke only; exact Release Simulator artifact ID from that CI run
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release-qualification-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ inputs.mode != 'ordinary-smoke' }}
    runs-on: ${{ fromJSON('{"macos-15":"macos-15","macos-15-intel":"macos-15-intel"}')[inputs.runner || 'macos-15'] }}
    timeout-minutes: ${{ inputs.mode == 'batch' && inputs.runner == 'macos-15-intel' && 68 || 58 }}
    # A successful capture still requires independent xcresult and visual review.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected runner architecture
        timeout-minutes: 1
        env:
          QUALIFICATION_RUNNER: ${{ inputs.runner || 'macos-15' }}
          QUALIFICATION_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          case "$QUALIFICATION_RUNNER:$QUALIFICATION_RUNNER_ARCH:$(uname -m)" in
            macos-15:ARM64:arm64|macos-15-intel:X64:x86_64) ;;
            *) echo 'Unexpected qualification runner label or architecture' >&2; exit 1 ;;
          esac
      - name: Prepare XcodeGen
        timeout-minutes: 3
        run: brew install xcodegen
      - name: Verify qualification guards
        timeout-minutes: 5
        run: |
          python3 -B scripts/test-qualify-release.py
          python3 -B scripts/test-batch-driver.py
          python3 -B scripts/test-batch-checkpoint.py
          python3 -B scripts/test-batch-checkpoint-host.py
          python3 -B scripts/test-batch-scroll-container.py
          python3 -B scripts/test-batch-import-diagnostics.py
          python3 -B scripts/test-native-batch-seed.py
          python3 -B scripts/test-native-root-fixture.py
          python3 -B scripts/test-native-root-ui.py
          python3 -B scripts/test-native-folder-geometry.py
          python3 -B scripts/test-native-folder-direct.py
          python3 -B scripts/test-native-folder-control.py
          python3 -B scripts/test-simulator-driver-inventory.py
          python3 -B scripts/test-biometric-handshake.py
      - name: Capture selected suite for review
        timeout-minutes: ${{ inputs.mode == 'batch' && inputs.runner == 'macos-15-intel' && 54 || 44 }}
        env:
          QUALIFICATION_MODE: ${{ inputs.mode }}
          QUALIFICATION_RUNNER: ${{ inputs.runner || 'macos-15' }}
          QUALIFICATION_RUNNER_ARCH: ${{ runner.arch }}
        run: python3 -B scripts/qualify-release.py --mode "$QUALIFICATION_MODE"
      - name: Qualification evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-qualification-${{ inputs.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ReleaseQualification-*/
            build/BatchSimulator-*/summary.json
            build/BatchSimulator-*/actions.jsonl
            build/BatchSimulator-*/fixtures/
            build/BatchSimulator-*/fixture-manifest.json
            build/BatchSimulator-*/xcresult-*.json
            build/BatchSimulator-*/xcodebuild.log
            build/BatchSimulator-*/Tests.xcresult/
            build/PrivacySimulator-*/summary.json
            build/PrivacySimulator-*/actions.jsonl
            build/PrivacySimulator-*/xcresult-*.json
            build/PrivacySimulator-*/xcodebuild.log
            build/PrivacySimulator-*/Tests.xcresult/
          if-no-files-found: error
          retention-days: 14

  ordinary-smoke:
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.mode == 'ordinary-smoke' }}
    runs-on: ${{ fromJSON('{"macos-15":"macos-15","macos-15-intel":"macos-15-intel"}')[inputs.runner || 'macos-15'] }}
    timeout-minutes: 32
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Set isolated smoke output directory
        id: smoke_directory
        timeout-minutes: 1
        run: >-
          printf 'SMOKE_DIR=%s/release-smoke-%s-%s\n'
          "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and acquire exact successful-main artifact
        id: prepare
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUNNER: ${{ inputs.runner || 'macos-15' }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: >-
          python3 -B scripts/prepare-cloud-smoke.py
          --commit "$CANDIDATE_COMMIT" --run-id "$CANDIDATE_RUN_ID"
          --artifact-id "$CANDIDATE_ARTIFACT_ID" --out "$SMOKE_DIR"
      - name: Capture one ordinary Release launch for independent review
        timeout-minutes: 20
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_TREE: ${{ steps.prepare.outputs.tree }}
        run: >-
          python3 -B scripts/release-smoke.py --run
          --repo "$GITHUB_WORKSPACE" --commit "$CANDIDATE_COMMIT" --tree "$CANDIDATE_TREE"
          --app-dir "$SMOKE_DIR/inputs/Tripfolio.app"
          --zip "$SMOKE_DIR/inputs/TripDocket-Simulator.zip" --out "$SMOKE_DIR/capture"
          --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --runtime-build 23C54
      - name: Retain original payload and source-bound success or failure evidence
        if: ${{ always() && steps.smoke_directory.outcome == 'success' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-release-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SMOKE_DIR }}/acquisition.json
            ${{ env.SMOKE_DIR }}/inputs/TripDocket-Simulator.zip
            ${{ env.SMOKE_DIR }}/inputs/provenance.json
            ${{ env.SMOKE_DIR }}/inputs/SHA256SUMS
            ${{ env.SMOKE_DIR }}/capture/
          if-no-files-found: error
          retention-days: 14
