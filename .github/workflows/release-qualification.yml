# Temporary diagnostic/intel-boot branch only; do not promote this workflow.
# The original name/job preserve Qualification's real GitHub context checks.
name: Release qualification
run-name: "Intel first-boot measurement (no application qualification)"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel-boot-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify branch and Intel runner
        timeout-minutes: 1
        env:
          DIAGNOSTIC_ARCH: ${{ runner.arch }}
        run: |
          test "$GITHUB_REF" = refs/heads/diagnostic/intel-boot
          test "$DIAGNOSTIC_ARCH" = X64
          test "$(uname -m)" = x86_64
      - name: Prepare XcodeGen
        timeout-minutes: 3
        run: brew install xcodegen
      - name: Verify diagnostic boundaries
        timeout-minutes: 2
        run: python3 -B scripts/test-intel-boot-diagnostic.py
      - name: Observe first boot only
        timeout-minutes: 44
        run: python3 -B scripts/intel-boot-diagnostic.py
      - name: Boot diagnostic evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-intel-boot-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ReleaseQualification-*/
          if-no-files-found: error
          retention-days: 14
