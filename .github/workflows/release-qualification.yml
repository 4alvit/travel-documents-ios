name: ARM 26.2 toolchain probe
run-name: ARM Xcode 26.2 metadata / ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolchain-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/diagnostic/arm-262-capacity'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Capture one bounded metadata probe
        timeout-minutes: 6
        run: python3 -B scripts/probe-xcode-toolchain.py
      - name: Toolchain metadata evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-arm-toolchain-26-2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ToolchainProbe/
          if-no-files-found: error
          retention-days: 7
