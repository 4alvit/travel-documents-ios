name: Release qualification
run-name: Bounded post-boot inventory diagnostic, no test acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 22
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        timeout-minutes: 2
        run: brew install xcodegen
      - name: Observe one post-boot inventory with bounded cleanup
        timeout-minutes: 20
        run: |
          python3 -B - <<'PYTHON'
          import importlib.util, json, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('q', 'scripts/qualify-release.py')
          q = importlib.util.module_from_spec(spec); spec.loader.exec_module(q)
          run = q.Qualification(Path.cwd(), 'biometrics', os.environ)
          run.work_deadline = run.started + 900
          run.cleanup_deadline = run.work_deadline + 180
          run.commands.limit = run.xcode.limit = run.work_deadline
          run.report['limits'] = {'work_seconds': 900, 'cleanup_seconds': 180}
          run.report['diagnostic'] = 'One post-boot inventory, 120s work allowance; no build/tests or acceptance'
          completed = False
          try:
              run.prepare()
              output = run.command('post-boot-inventory-control', ['xcrun', 'simctl', 'list', 'devices', '--json'], 120)
              current = q.device_map(json.loads(output))
              run.verify_owned(current)
              q.require(current[run.owned]['state'] == 'Booted', 'Owned device is not booted')
              run.report['observed_inventory'] = current
              q.require(run.source('source-after') == run.before, 'Source changed')
              completed = True
          except BaseException as error:
              run.report['errors'].append(repr(error))
          finally:
              try: run.cleanup()
              except BaseException as error: run.report['errors'].append('Cleanup: ' + repr(error))
              run.report['status'] = 'diagnostic_complete' if completed and not run.report['errors'] and run.report['cleanup_verified'] else 'diagnostic_failed'
              run.report['release_accepted'] = False
              run.save()
          sys.exit(0 if run.report['status'] == 'diagnostic_complete' else 1)
          PYTHON
      - name: Diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TripDocket-postboot-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ReleaseQualification-*/
          if-no-files-found: error
          retention-days: 7
